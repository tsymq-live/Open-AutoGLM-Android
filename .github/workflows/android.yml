name: Android CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug or release)'
        required: true
        default: 'debug'
      upload_apk:
        description: 'Upload APK (true or false)'
        required: true
        default: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "platform-tools"
          yes | sdkmanager --licenses

      - name: Build APK
        run: ./gradlew --no-daemon :app:assemble${{ github.event.inputs.build_mode | capitalize }}

      - name: Unit tests
        run: ./gradlew --no-daemon :app:test${{ github.event.inputs.build_mode | capitalize }}UnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lint${{ github.event.inputs.build_mode | capitalize }}

      - name: Upload APK
        if: ${{ github.event.inputs.upload_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_mode }}-apk
          path: app/build/outputs/apk/${{ github.event.inputs.build_mode }}/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
